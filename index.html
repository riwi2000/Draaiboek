:root {
    --ink: #171714;
    --paper: #f3f0e8;
    --acid: #d8ff45;
    --muted: #6d6b62;
    --line: #d8d4ca
}

* {
    box-sizing: border-box
}

html {
    scroll-behavior: smooth
}

body {
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    font-family: Arial,Helvetica,sans-serif
}

button,input,select {
    font: inherit
}

button {
    cursor: pointer
}

.topbar {
    border-bottom: 1px solid var(--line);
    justify-content: space-between;
    align-items: center;
    min-height: 78px;
    padding: 0 5vw;
    display: flex
}

.brand {
    color: inherit;
    letter-spacing: -1px;
    align-items: center;
    gap: 11px;
    font-size: 20px;
    font-weight: 900;
    text-decoration: none;
    display: flex
}

.brand-mark {
    background: var(--ink);
    width: 35px;
    height: 35px;
    color: var(--acid);
    border-radius: 50%;
    place-items: center;
    display: grid;
    transform: rotate(-8deg)
}

.secure-note {
    color: var(--muted);
    font-size: 12px
}

.secure-note span {
    color: #56a536;
    margin-right: 5px;
    font-size: 9px
}

.hero {
    text-align: center;
    max-width: 1120px;
    margin: 0 auto;
    padding: 84px 24px 66px;
    position: relative;
    overflow: hidden
}

.hero:before,.hero:after {
    content: "";
    border: 1px solid var(--line);
    z-index: -1;
    border-radius: 50%;
    position: absolute
}

.hero:before {
    width: 360px;
    height: 180px;
    top: 55px;
    left: -230px;
    transform: rotate(-15deg)
}

.hero:after {
    width: 340px;
    height: 340px;
    top: 6px;
    right: -280px
}

.eyebrow,.kicker {
    letter-spacing: .2em;
    font-size: 11px;
    font-weight: 800
}

.eyebrow {
    border: 1px solid var(--ink);
    border-radius: 999px;
    margin-bottom: 22px;
    padding: 7px 12px;
    display: inline-block
}

h1 {
    letter-spacing: -.075em;
    margin: 0;
    font-size: clamp(48px,7.3vw,105px);
    font-weight: 950;
    line-height: .9
}

h1 em {
    font-family: Georgia,Times New Roman,serif;
    font-weight: 400
}

.intro {
    max-width: 600px;
    color: var(--muted);
    margin: 28px auto 32px;
    font-size: 17px;
    line-height: 1.55
}

.url-card {
    text-align: left;
    max-width: 800px;
    box-shadow: 8px 8px 0 var(--ink);
    background: #fff;
    border: 1px solid #dedbd2;
    margin: 0 auto;
    padding: 20px
}

.url-card label {
    margin-bottom: 9px;
    font-size: 13px;
    font-weight: 800;
    display: block
}

.url-row {
    background: #faf9f5;
    border: 1px solid #bcb9b0;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    display: grid
}

.link-icon {
    color: var(--muted);
    padding-left: 15px
}

.url-row input {
    background: 0 0;
    border: 0;
    outline: 0;
    min-width: 0;
    padding: 16px 12px
}

.url-row button,.download-button {
    background: var(--acid);
    color: var(--ink);
    border: 0;
    padding: 16px 21px;
    font-weight: 900
}

.url-row button:disabled,.download-button:disabled {
    cursor: not-allowed;
    opacity: .5
}

.url-row button {
    border-left: 1px solid var(--ink)
}

.url-row button span,.download-button span {
    margin-left: 14px
}

.url-card>p {
    color: #858176;
    margin: 10px 0 0;
    font-size: 11px
}

.status-message {
    border-left: 4px solid var(--orange);
    text-align: left;
    background: #fff0ea;
    max-width: 800px;
    margin: 21px auto 0;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.5
}

.status-message.success {
    background: #effbd0;
    border-color: #85a90e
}

.schedule-shell {
    max-width: 1100px;
    margin: 0 auto 100px;
    padding: 0 24px
}

.source-line {
    color: var(--muted);
    justify-content: space-between;
    gap: 18px;
    padding-bottom: 14px;
    font-size: 12px;
    display: flex
}

.source-line span {
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden
}

.source-line a {
    color: var(--ink);
    flex: none;
    font-weight: 800
}

.schedule-header {
    border-bottom: 2px solid var(--ink);
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 3px 18px;
    display: flex
}

.schedule-header h2 {
    letter-spacing: -.04em;
    margin: 7px 0 0;
    font-size: 31px
}

.selection-count {
    align-items: center;
    gap: 10px;
    display: flex
}

.selection-count strong {
    font-family: Georgia,serif;
    font-size: 40px;
    font-style: italic;
    font-weight: 400
}

.selection-count span {
    color: var(--muted);
    font-size: 12px
}

.sets {
    border-bottom: 1px solid var(--ink)
}

.selection-tools {
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 0 0;
    display: flex
}

.selection-tools button {
    color: var(--muted);
    background: 0 0;
    border: 0;
    padding: 5px 7px;
    font-size: 11px;
    text-decoration: underline
}

.set-row {
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    grid-template-columns: 30px 84px 140px 1fr 1fr 54px;
    align-items: center;
    gap: 18px;
    min-height: 88px;
    display: grid;
    position: relative
}

.set-row:last-child {
    border-bottom: 0
}

.set-row input {
    opacity: 0;
    position: absolute
}

.custom-check {
    border: 1px solid var(--ink);
    background: var(--acid);
    place-items: center;
    width: 22px;
    height: 22px;
    font-size: 13px;
    font-weight: 900;
    display: grid
}

.set-unchecked {
    opacity: .5
}

.set-unchecked .custom-check {
    background: 0 0
}

.set-row:focus-within .custom-check {
    outline-offset: 2px;
    outline: 3px solid #17171438
}

.day-pill {
    border: 1px solid var(--ink);
    text-transform: uppercase;
    border-radius: 999px;
    width: fit-content;
    padding: 6px 9px;
    font-size: 10px;
    font-weight: 900
}

.set-time {
    font-family: Courier New,monospace;
    font-size: 13px
}

.set-name {
    letter-spacing: -.04em;
    font-size: 24px;
    font-weight: 900
}

.set-area {
    color: var(--muted);
    font-size: 14px
}

.number {
    color: #b7b3aa;
    text-align: right;
    font-family: Georgia,serif;
    font-size: 34px;
    font-style: italic
}

.export-bar {
    justify-content: space-between;
    align-items: end;
    padding-top: 24px;
    display: flex
}

.reminder-fieldset {
    border: 0;
    min-width: 410px;
    margin: 0;
    padding: 0
}

.reminder-fieldset legend {
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-size: 11px;
    font-weight: 800;
    display: block
}

.reminder-options {
    gap: 18px;
    margin-bottom: 11px;
    display: flex
}

.radio-label {
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 700;
    display: flex
}

.custom-reminder {
    display: flex
}

.custom-reminder input {
    background: 0 0;
    border: 1px solid #aaa69c;
    border-right: 0;
    width: 90px;
    padding: 11px
}

.custom-reminder select {
    background: 0 0;
    border: 1px solid #aaa69c;
    min-width: 120px;
    padding: 11px
}

.download-button {
    border: 1px solid var(--ink);
    min-width: 240px;
    box-shadow: 5px 5px 0 var(--ink);
    padding: 16px 20px
}

.calendar-note {
    color: var(--muted);
    text-align: right;
    margin: 18px 0 0;
    font-size: 11px
}

.empty-state {
    max-width: 1100px;
    margin: 0 auto 100px;
    padding: 0 24px
}

.empty-state>.kicker {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 17px
}

.steps {
    grid-template-columns: repeat(3,1fr);
    display: grid
}

.steps>div {
    border-bottom: 1px solid var(--ink);
    min-height: 200px;
    padding: 28px 28px 28px 0
}

.steps>div+div {
    border-left: 1px solid var(--line);
    padding-left: 28px
}

.steps strong {
    color: #b7b3aa;
    font-family: Georgia,serif;
    font-size: 36px;
    font-style: italic
}

.steps h2 {
    margin: 18px 0 8px;
    font-size: 22px
}

.steps p {
    color: var(--muted);
    margin: 0;
    font-size: 13px;
    line-height: 1.5
}

footer {
    border-top: 1px solid var(--line);
    min-height: 110px;
    color: var(--muted);
    justify-content: space-between;
    align-items: center;
    padding: 0 5vw;
    display: flex
}

footer span {
    letter-spacing: .2em;
    color: var(--ink);
    font-size: 13px;
    font-weight: 900
}

footer p {
    font-family: Georgia,serif;
    font-style: italic
}

@media (max-width: 760px) {
    .topbar {
        min-height:66px
    }

    .secure-note {
        display: none
    }

    .hero {
        padding-top: 58px
    }

    h1 {
        font-size: clamp(44px,14vw,70px)
    }

    .url-card {
        box-shadow: 5px 5px 0 var(--ink);
        padding: 14px
    }

    .url-row {
        grid-template-columns: auto 1fr
    }

    .url-row button {
        border: 0;
        border-top: 1px solid var(--ink);
        grid-column: 1/-1
    }

    .set-row {
        grid-template-columns: 30px 78px 1fr 36px;
        gap: 10px;
        padding: 14px 0
    }

    .set-time {
        grid-column: 2
    }

    .set-name {
        grid-area: 1/3;
        font-size: 20px
    }

    .set-area {
        grid-area: 2/3
    }

    .number {
        grid-area: 1/4/3
    }

    .export-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 20px
    }

    .reminder-fieldset,.download-button {
        width: 100%;
        min-width: 0
    }

    .custom-reminder input {
        width: 40%
    }

    .custom-reminder select {
        width: 60%
    }

    .calendar-note {
        text-align: left
    }

    .steps {
        grid-template-columns: 1fr
    }

    .steps>div {
        min-height: 0;
        padding: 22px 0
    }

    .steps>div+div {
        border-left: 0;
        padding-left: 0
    }

    footer {
        min-height: 90px
    }
}


/* Standalone version */
.url-card { display:none; }
.status-message { display:none; }
.source-line a { display:none; }
.secure-note span { color:#56a536; }
.set-row.set-unchecked { opacity:.5; }

<script>
(() => {
const C=document.getElementById("setsContainer"),R=[...C.querySelectorAll(".set-row")],

D=document.getElementById("downloadButton"),SS=document.getElementById("sortSelect"),

const searchGroup=document.getElementById("searchGroup");
const desktopSearchSlot=document.getElementById("desktopSearchSlot");

const mobileLandscape=window.matchMedia("(orientation: landscape) and (max-height: 600px), (orientation: landscape) and (pointer: coarse)");
const infoTop=document.getElementById("calendarInfoTop"),infoBottom=document.getElementById("calendarInfoBottom");
const customReminderTop=document.getElementById("customReminderTop"),customReminderBottom=document.getElementById("customReminderBottom");
const downloadRowTop=document.getElementById("downloadRowTop"),downloadRowBottom=document.getElementById("downloadRowBottom");
const infoMessage=document.getElementById("calendarInfoMessage");

const visualTimetable=document.getElementById("visualTimetable");
const visualTimetableContent=document.getElementById("visualTimetableContent");
let visualMode=false;
function placeSearch(){

}

function placeInfoMessage(button){

   infoMessage.classList.add("portrait-position");
 }else if(mobileLandscape.matches){
   document.body.appendChild(infoMessage);
   if(button===infoTop){
     const buttonBox=button.getBoundingClientRect();

     infoMessage.style.setProperty("--info-landscape-left",`${buttonBox.right+10}px`);
     infoMessage.style.setProperty("--info-landscape-top",`${searchBox.top+(searchBox.height/2)}px`);
     infoMessage.classList.add("landscape-position");
   }
 }else if(mobileLayout.matches){
   document.body.appendChild(infoMessage);
 }else{
   button.parentElement.appendChild(infoMessage);
   infoMessage.classList.add("desktop-position");
 }
}
function showCalendarInfo(event){
 clearTimeout(infoTimer);
 placeInfoMessage(event.currentTarget);
 infoMessage.classList.add("show");
 infoMessage.setAttribute("aria-hidden","false");
 infoTop.setAttribute("aria-expanded","true");
 infoBottom.setAttribute("aria-expanded","true");
 infoTimer=setTimeout(()=>{
   infoMessage.classList.remove("show");
   infoMessage.setAttribute("aria-hidden","true");
   infoTop.setAttribute("aria-expanded","false");
   infoBottom.setAttribute("aria-expanded","false");

}

infoBottom.onclick=showCalendarInfo;

const day=r=>((r.querySelector(".day-pill")?.textContent||"").trim().toLowerCase().startsWith("vrijdag")?"f":"s");
const time=r=>{let m=(r.querySelector(".set-time")?.textContent||"").match(/(\d{1,2}):(\d{2})/);return m? +m[1]*60 + +m[2]:0};
const area=r=>(r.querySelector(".set-area")?.textContent||"").trim().toLowerCase();
const dj=r=>(r.querySelector(".set-name")?.textContent||"").trim().toLowerCase();
const chosen=()=>R.filter(r=>r.querySelector('input[type=checkbox]').checked);

function update(){
 let n=chosen().length;
 if(!n&&visualMode)setVisualMode(false);
 visualToggle.disabled=n===0;
 visualToggle.setAttribute("aria-disabled",n===0?"true":"false");
 D.innerHTML=`Download calendar <span aria-hidden="true">↓</span>`;
 D.disabled = n === 0;
 D.setAttribute("aria-disabled", n === 0 ? "true" : "false");
 DB.innerHTML=`Download calendar <span aria-hidden="true">↓</span>`;
 DB.disabled = n === 0;
 DB.setAttribute("aria-disabled", n === 0 ? "true" : "false");
 SA.textContent=portraitSelection.matches&&n>0?"Delete all":"Select all";
 CA.textContent="Delete all";
 R.forEach(r=>{let c=r.querySelector('input[type=checkbox]'),m=r.querySelector(".custom-check");
 r.classList.toggle("set-unchecked",!c.checked); if(m)m.textContent=c.checked?"✓":""});
 if(visualMode)renderVisualTimetable();
}
function filterSort(){
 const fridaySelected=F.checked;
 const saturdaySelected=S.checked;
 const noDaySelected=!fridaySelected&&!saturdaySelected;
 let query=String(Q.value||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
 let visible=R.filter(r=>{
   let matchesDay=noDaySelected||(day(r)==="f"&&fridaySelected)||(day(r)==="s"&&saturdaySelected);
   let artist=dj(r).normalize("NFKD").replace(/[\u0300-\u036f]/g,"");
   return matchesDay&&(!query||artist.includes(query));
 });
 let sort=SS.value;
 visible.sort((a,b)=>{
   if(sort==="area") return area(a).localeCompare(area(b),"nl");
   if(sort==="dj") return dj(a).localeCompare(dj(b),"nl");
   return day(a)!==day(b)?(day(a)==="f"?-1:1):time(a)-time(b);
 });
 [...visible,...R.filter(r=>!visible.includes(r))].forEach(r=>{
   C.appendChild(r);
   r.style.display=visible.includes(r)?"":"none";
 });
 F.checked=fridaySelected;
 S.checked=saturdaySelected;
 update();
}
R.forEach(r=>{
 let c=r.querySelector('input[type=checkbox]'); c.checked=false;
 c.addEventListener("change",update);
});
SA.onclick=()=>{
 if(portraitSelection.matches&&chosen().length){
   R.forEach(r=>r.querySelector('input[type=checkbox]').checked=false);
 }else{
   R.forEach(r=>{if(r.style.display!=="none")r.querySelector('input[type=checkbox]').checked=true});
 }
 update();
};
CA.onclick=()=>{R.forEach(r=>r.querySelector('input[type=checkbox]').checked=false);update()};
portraitSelection.addEventListener("change",()=>{placeInfoButtons();update()});
SS.addEventListener("change",()=>{
 if(SS.value==="dj"&&F.checked&&S.checked){
   F.checked=false;
   S.checked=false;
 }
 filterSort();
});
[F,S].forEach(x=>x.addEventListener("change",filterSort));
Q.addEventListener("input",()=>{filterSort();requestAnimationFrame(updateCurrentDay)});
document.getElementById("clearSearch").onclick=()=>{
 Q.value="";
 filterSort();
 requestAnimationFrame(updateCurrentDay);
 Q.focus();
};

const topReminder=[...document.querySelectorAll('input[name="reminder"]')];
const bottomReminder=[...document.querySelectorAll('input[name="reminderBottom"]')];
function syncReminder(from,to){
 const selected=from.find(r=>r.checked)?.value;
 to.forEach(r=>r.checked=r.value===selected);
}
topReminder.forEach(r=>r.addEventListener("change",()=>syncReminder(topReminder,bottomReminder)));
bottomReminder.forEach(r=>r.addEventListener("change",()=>syncReminder(bottomReminder,topReminder)));
RV.addEventListener("input",()=>RVB.value=RV.value);
RVB.addEventListener("input",()=>RV.value=RVB.value);
RU.addEventListener("change",()=>RUB.value=RU.value);
RUB.addEventListener("change",()=>RU.value=RUB.value);

function esc(s){return String(s).replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\r?\n/g,"\\n")}
function fold(x){let o="",c="",b=new TextEncoder();for(let ch of x){if(b.encode(c+ch).length>75){o+=c+"\r\n ";c=ch}else c+=ch}return o+c}
function stamp(d,h,m){return d.replaceAll("-","")+"T"+String(h).padStart(2,"0")+String(m).padStart(2,"0")+"00"}
function start(day,t){let d=day==="f"?"2026-09-04":"2026-09-05",[h,m]=t.split(":").map(Number);return{d,h,m}}
function end(d,h,m){let x=new Date(`${d}T${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:00`);if(h<6)x.setDate(x.getDate()+1);return{d:x.toISOString().slice(0,10),h:x.getHours(),m:x.getMinutes()}}
function mins(){if(document.querySelector('input[name=reminder]:checked')?.value==="none")return null;let v=Math.max(1,+RV.value||10);return RU.value==="hours"?v*60:v}

D.onclick=()=>{
 let ch=chosen();
 if(!ch.length)return;

 const pad=n=>String(n).padStart(2,"0");
 const now=new Date();
 const dtstamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+
   "T"+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+"Z";
 const rm=mins();

 const uidPart=s=>{
   return String(s).normalize("NFKD")
     .replace(/[\u0300-\u036f]/g,"")
     .toLowerCase()
     .replace(/[^a-z0-9]+/g,"-")
     .replace(/^-+|-+$/g,"")
     .slice(0,80);
 };

 // Use the same ICS structure that is known to import correctly on Android.
 // Event times are explicitly Europe/Amsterdam local times.
 const L=[
   "BEGIN:VCALENDAR",
   "VERSION:2.0",
   "PRODID:-//Draaiboek//Draaimolen Festival 2026//NL",
   "CALSCALE:GREGORIAN"
 ];

 ch.forEach((r,i)=>{
   const da=day(r);
   const times=r.querySelector(".set-time").textContent.trim().split("–").map(x=>x.trim());
   const startTime=times[0];
   const endTime=times[1]||times[0];
   const name=r.querySelector(".set-name").textContent.trim();
   const ar=r.querySelector(".set-area").textContent.trim();

   const date=da==="f"?"20260904":"20260905";
   const [sh,sm]=startTime.split(":").map(Number);
   const [eh,em]=endTime.split(":").map(Number);

   let endDate=date;
   if((eh*60+em)<(sh*60+sm)){
     const d=new Date(Date.UTC(Number(date.slice(0,4)),Number(date.slice(4,6))-1,Number(date.slice(6,8))+1));
     endDate=d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate());
   }

   L.push("BEGIN:VEVENT");
   L.push(`UID:draaimolen-${date}-${pad(sh)}${pad(sm)}-${pad(eh)}${pad(em)}-${uidPart(name)}-${uidPart(ar)}@draaiboek.local`);
   L.push(`DTSTAMP:${dtstamp}`);
   L.push(`DTSTART;TZID=Europe/Amsterdam:${date}T${pad(sh)}${pad(sm)}00`);
   L.push(`DTEND;TZID=Europe/Amsterdam:${endDate}T${pad(eh)}${pad(em)}00`);
   L.push(`SUMMARY:${esc(name+" - "+ar)}`);
   L.push(`DESCRIPTION:${esc(name+" - "+ar)}`);
   L.push(`LOCATION:${esc(ar)}`);

   if(rm!==null){
     L.push("BEGIN:VALARM");
     L.push(`TRIGGER:-PT${rm}M`);
     L.push("ACTION:DISPLAY");
     L.push(`DESCRIPTION:${esc(name)} starts in ${rm} minutes`);
     L.push("END:VALARM");
   }

   L.push("END:VEVENT");
 });

 L.push("END:VCALENDAR");

 // No METHOD:PUBLISH, no VTIMEZONE and no BOM: this matches the
 // simple ICS structure known to import correctly on Android.
 const ics=L.join("\r\n")+"\r\n";
 const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="Draaiboek.ics";
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
};
DB.onclick=()=>D.click();

function visualMinute(value){
 const parts=String(value).trim().split(":").map(Number);
 let total=(parts[0]||0)*60+(parts[1]||0);
 if(total<360)total+=1440;
 return total-720;
}
function visualSetData(row){
 const values=row.querySelector(".set-time").textContent.trim().split("–").map(x=>x.trim());
 const start=visualMinute(values[0]);
 let end=visualMinute(values[1]||values[0]);
 if(end<=start)end+=1440;
 return{
   row,
   start,
   end,
   timeText:`${values[0]} – ${values[1]||values[0]}`,
   name:row.querySelector(".set-name").textContent.trim(),
   area:row.querySelector(".set-area").textContent.trim(),
   overlap:false,
   lane:0
 };
}
let expandedVisualBlock=null;
let expandedVisualTimer;
function collapseExpandedVisualBlock(){
 clearTimeout(expandedVisualTimer);
 if(!expandedVisualBlock)return;
 expandedVisualBlock.classList.remove("is-expanded");
 expandedVisualBlock.style.left=expandedVisualBlock.dataset.originalLeft||"";
 expandedVisualBlock.style.width=expandedVisualBlock.dataset.originalWidth||"";
 delete expandedVisualBlock.dataset.originalLeft;
 delete expandedVisualBlock.dataset.originalWidth;
 expandedVisualBlock=null;
}
function expandVisualBlock(block,nameElement){
 if(nameElement.scrollWidth<=nameElement.clientWidth+1)return;
 collapseExpandedVisualBlock();
 const chart=block.parentElement;
 const chartWidth=chart.clientWidth;
 const desiredWidth=Math.min(380,Math.max(240,nameElement.scrollWidth+28));
 const expandedWidth=Math.min(desiredWidth,chartWidth-16);
 const expandedLeft=Math.max(8,Math.min(block.offsetLeft,chartWidth-expandedWidth-8));
 block.dataset.originalLeft=block.style.left;
 block.dataset.originalWidth=block.style.width;
 block.style.left=`${expandedLeft}px`;
 block.style.width=`${expandedWidth}px`;
 block.classList.add("is-expanded");
 expandedVisualBlock=block;
 expandedVisualTimer=setTimeout(collapseExpandedVisualBlock,5000);
}
function renderVisualDay(dayCode,label,rows){
 const daySection=document.createElement("section");
 daySection.className="visual-day";
 const heading=document.createElement("h2");
 heading.className="visual-day-title";
 heading.textContent=label;
 daySection.appendChild(heading);

 const scroller=document.createElement("div");
 scroller.className="visual-scroll";
 const chart=document.createElement("div");
 chart.className="visual-chart";
 const range=750;
 const items=rows.map(visualSetData).sort((a,b)=>a.start-b.start||a.end-b.end);

 for(let i=0;i<items.length;i++){
   for(let j=i+1;j<items.length;j++){
     if(items[j].start>=items[i].end)break;
     if(items[i].start<items[j].end&&items[j].start<items[i].end){
       items[i].overlap=true;
       items[j].overlap=true;
     }
   }
 }

 const laneEnds=[];
 items.forEach(item=>{
   let lane=laneEnds.findIndex(end=>end<=item.start);
   if(lane<0)lane=laneEnds.length;
   item.lane=lane;
   laneEnds[lane]=item.end;
 });

 const ticks=[
   [0,"12:00"],[120,"14:00"],[240,"16:00"],[360,"18:00"],
   [480,"20:00"],[600,"22:00"],[720,"00:00"],[750,"00:30"]
 ];
 ticks.forEach(([minute,labelText])=>{
   const tick=document.createElement("div");
   tick.className="visual-tick";
   tick.style.left=`${(minute/range)*100}%`;
   const tickLabel=document.createElement("span");
   tickLabel.className="visual-tick-label";
   tickLabel.textContent=labelText;
   if(minute===720){
     tickLabel.style.transform="translateX(-100%)";
   }
   if(minute===range){
     tickLabel.style.top="20px";
     tickLabel.style.transform="translateX(-100%)";
   }
   tick.appendChild(tickLabel);
   chart.appendChild(tick);
 });

 items.forEach(item=>{
   const block=document.createElement("div");
   block.className=`visual-set-block${item.overlap?" has-overlap":""}`;
   block.style.left=`${Math.max(0,item.start/range*100)}%`;
   block.style.width=`${Math.max(.8,(item.end-item.start)/range*100)}%`;
   block.style.top=`${36+(item.lane*72)}px`;
   block.title=`${item.name} — ${item.timeText} — ${item.area}`;
   block.setAttribute("aria-label",block.title);
   block.setAttribute("role","button");
   block.tabIndex=0;
   block.addEventListener("click",()=>expandVisualBlock(block,name));
   block.addEventListener("keydown",event=>{
     if(event.key==="Enter"||event.key===" "){
       event.preventDefault();
       expandVisualBlock(block,name);
     }
   });
   const name=document.createElement("div");
   name.className="visual-set-name";
   name.textContent=item.name;
   const meta=document.createElement("div");
   meta.className="visual-set-meta";
   const timeLine=document.createElement("div");
   timeLine.className="visual-set-time";
   timeLine.textContent=item.timeText;
   const areaLine=document.createElement("div");
   areaLine.className="visual-set-area";
   areaLine.textContent=item.area;
   meta.append(timeLine,areaLine);
   block.append(name,meta);
   chart.appendChild(block);
 });

 chart.style.height=`${Math.max(108,44+(Math.max(1,laneEnds.length)*72))}px`;
 scroller.appendChild(chart);
 daySection.appendChild(scroller);
 return daySection;
}
function renderVisualTimetable(){
 collapseExpandedVisualBlock();
 visualTimetableContent.replaceChildren();
 const selected=chosen();
 const useBoth=!F.checked&&!S.checked;
 const fridayRows=selected.filter(r=>day(r)==="f"&&(useBoth||F.checked));
 const saturdayRows=selected.filter(r=>day(r)==="s"&&(useBoth||S.checked));
 if(!fridayRows.length&&!saturdayRows.length){
   const empty=document.createElement("div");
   empty.className="visual-empty";
   empty.textContent="Select artists to view and/or download your timetable.";
   visualTimetableContent.appendChild(empty);
   return;
 }
 if(fridayRows.length)visualTimetableContent.appendChild(renderVisualDay("f","Friday",fridayRows));
 if(saturdayRows.length)visualTimetableContent.appendChild(renderVisualDay("s","Saturday",saturdayRows));
}
function setVisualMode(enabled){
 visualMode=enabled;
 C.hidden=enabled;
 currentDay.hidden=enabled&&!portraitSelection.matches;
 visualTimetable.hidden=!enabled;
 visualToggle.textContent=enabled?"Back to list":"My timetable";
 visualToggle.setAttribute("aria-pressed",enabled?"true":"false");
 if(enabled)renderVisualTimetable();
 else requestAnimationFrame(updateCurrentDay);
}
visualToggle.addEventListener("click",()=>setVisualMode(!visualMode));
function updateCurrentDay(){
 const visible=R.filter(r=>r.style.display!=="none");
 if(!visible.length){currentDayLabel.textContent="";return}
 const top=currentDay.getBoundingClientRect().bottom;
 let best=visible[0],bestDistance=Infinity;
 visible.forEach(r=>{
   const rect=r.getBoundingClientRect();
   const distance=Math.abs(rect.top-top);
   if(rect.bottom>=top-10&&distance<bestDistance){best=r;bestDistance=distance}
 });
 currentDayLabel.textContent=day(best)==="f"?"FRIDAY":"SATURDAY";
}
window.addEventListener("scroll",updateCurrentDay,{passive:true});
[SS,F,S].forEach(x=>x.addEventListener("change",()=>requestAnimationFrame(updateCurrentDay)));
filterSort();
updateCurrentDay();
})();
</script></body>
