:root {
    --ink: #171714;
    --paper: #f3f0e8;
    --acid: #d8ff45;
    --muted: #6d6b62;
    --line: #d8d4ca
}

* {
    box-sizing: border-box
}

html {
    scroll-behavior: smooth
}

body {
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    font-family: Arial,Helvetica,sans-serif
}

button,input,select {
    font: inherit
}

button {
    cursor: pointer
}

.topbar {
    border-bottom: 1px solid var(--line);
    justify-content: space-between;
    align-items: center;
    min-height: 78px;
    padding: 0 5vw;
    display: flex
}

.brand {
    color: inherit;
    letter-spacing: -1px;
    align-items: center;
    gap: 11px;
    font-size: 20px;
    font-weight: 900;
    text-decoration: none;
    display: flex
}

.brand-mark {
    background: var(--ink);
    width: 35px;
    height: 35px;
    color: var(--acid);
    border-radius: 50%;
    place-items: center;
    display: grid;
    transform: rotate(-8deg)
}

.secure-note {
    color: var(--muted);
    font-size: 12px
}

.secure-note span {
    color: #56a536;
    margin-right: 5px;
    font-size: 9px
}

.hero {
    text-align: center;
    max-width: 1120px;
    margin: 0 auto;
    padding: 84px 24px 66px;
    position: relative;
    overflow: hidden
}

.hero:before,.hero:after {
    content: "";
    border: 1px solid var(--line);
    z-index: -1;
    border-radius: 50%;
    position: absolute
}

.hero:before {
    width: 360px;
    height: 180px;
    top: 55px;
    left: -230px;
    transform: rotate(-15deg)
}

.hero:after {
    width: 340px;
    height: 340px;
    top: 6px;
    right: -280px
}

.eyebrow,.kicker {
    letter-spacing: .2em;
    font-size: 11px;
    font-weight: 800
}

.eyebrow {
    border: 1px solid var(--ink);
    border-radius: 999px;
    margin-bottom: 22px;
    padding: 7px 12px;
    display: inline-block
}

h1 {
    letter-spacing: -.075em;
    margin: 0;
    font-size: clamp(48px,7.3vw,105px);
    font-weight: 950;
    line-height: .9
}

h1 em {
    font-family: Georgia,Times New Roman,serif;
    font-weight: 400
}

.intro {
    max-width: 600px;
    color: var(--muted);
    margin: 28px auto 32px;
    font-size: 17px;
    line-height: 1.55
}

.url-card {
    text-align: left;
    max-width: 800px;
    box-shadow: 8px 8px 0 var(--ink);
    background: #fff;
    border: 1px solid #dedbd2;
    margin: 0 auto;
    padding: 20px
}

.url-card label {
    margin-bottom: 9px;
    font-size: 13px;
    font-weight: 800;
    display: block
}

.url-row {
    background: #faf9f5;
    border: 1px solid #bcb9b0;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    display: grid
}

.link-icon {
    color: var(--muted);
    padding-left: 15px
}

.url-row input {
    background: 0 0;
    border: 0;
    outline: 0;
    min-width: 0;
    padding: 16px 12px
}

.url-row button,.download-button {
    background: var(--acid);
    color: var(--ink);
    border: 0;
    padding: 16px 21px;
    font-weight: 900
}

.url-row button:disabled,.download-button:disabled {
    cursor: not-allowed;
    opacity: .5
}

.url-row button {
    border-left: 1px solid var(--ink)
}

.url-row button span,.download-button span {
    margin-left: 14px
}

.url-card>p {
    color: #858176;
    margin: 10px 0 0;
    font-size: 11px
}

.status-message {
    border-left: 4px solid var(--orange);
    text-align: left;
    background: #fff0ea;
    max-width: 800px;
    margin: 21px auto 0;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.5
}

.status-message.success {
    background: #effbd0;
    border-color: #85a90e
}

.schedule-shell {
    max-width: 1100px;
    margin: 0 auto 100px;
    padding: 0 24px
}

.source-line {
    color: var(--muted);
    justify-content: space-between;
    gap: 18px;
    padding-bottom: 14px;
    font-size: 12px;
    display: flex
}

.source-line span {
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden
}

.source-line a {
    color: var(--ink);
    flex: none;
    font-weight: 800
}

.schedule-header {
    border-bottom: 2px solid var(--ink);
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 3px 18px;
    display: flex
}

.schedule-header h2 {
    letter-spacing: -.04em;
    margin: 7px 0 0;
    font-size: 31px
}

.selection-count {
    align-items: center;
    gap: 10px;
    display: flex
}

.selection-count strong {
    font-family: Georgia,serif;
    font-size: 40px;
    font-style: italic;
    font-weight: 400
}

.selection-count span {
    color: var(--muted);
    font-size: 12px
}

.sets {
    border-bottom: 1px solid var(--ink)
}

.selection-tools {
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 0 0;
    display: flex
}

.selection-tools button {
    color: var(--muted);
    background: 0 0;
    border: 0;
    padding: 5px 7px;
    font-size: 11px;
    text-decoration: underline
}

.set-row {
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    grid-template-columns: 30px 84px 140px 1fr 1fr 54px;
    align-items: center;
    gap: 18px;
    min-height: 88px;
    display: grid;
    position: relative
}

.set-row:last-child {
    border-bottom: 0
}

.set-row input {
    opacity: 0;
    position: absolute
}

.custom-check {
    border: 1px solid var(--ink);
    background: var(--acid);
    place-items: center;
    width: 22px;
    height: 22px;
    font-size: 13px;
    font-weight: 900;
    display: grid
}

.set-unchecked {
    opacity: .5
}

.set-unchecked .custom-check {
    background: 0 0
}

.set-row:focus-within .custom-check {
    outline-offset: 2px;
    outline: 3px solid #17171438
}

.day-pill {
    border: 1px solid var(--ink);
    text-transform: uppercase;
    border-radius: 999px;
    width: fit-content;
    padding: 6px 9px;
    font-size: 10px;
    font-weight: 900
}

.set-time {
    font-family: Courier New,monospace;
    font-size: 13px
}

.set-name {
    letter-spacing: -.04em;
    font-size: 24px;
    font-weight: 900
}

.set-area {
    color: var(--muted);
    font-size: 14px
}

.number {
    color: #b7b3aa;
    text-align: right;
    font-family: Georgia,serif;
    font-size: 34px;
    font-style: italic
}

.export-bar {
    justify-content: space-between;
    align-items: end;
    padding-top: 24px;
    display: flex
}

.reminder-fieldset {
    border: 0;
    min-width: 410px;
    margin: 0;
    padding: 0
}

.reminder-fieldset legend {
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-size: 11px;
    font-weight: 800;
    display: block
}

.reminder-options {
    gap: 18px;
    margin-bottom: 11px;
    display: flex
}

.radio-label {
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 700;
    display: flex
}

.custom-reminder {
    display: flex
}

.custom-reminder input {
    background: 0 0;
    border: 1px solid #aaa69c;
    border-right: 0;
    width: 90px;
    padding: 11px
}

.custom-reminder select {
    background: 0 0;
    border: 1px solid #aaa69c;
    min-width: 120px;
    padding: 11px
}

.download-button {
    border: 1px solid var(--ink);
    min-width: 240px;
    box-shadow: 5px 5px 0 var(--ink);
    padding: 16px 20px
}

.calendar-note {
    color: var(--muted);
    text-align: right;
    margin: 18px 0 0;
    font-size: 11px
}

.empty-state {
    max-width: 1100px;
    margin: 0 auto 100px;
    padding: 0 24px
}

.empty-state>.kicker {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 17px
}

.steps {
    grid-template-columns: repeat(3,1fr);
    display: grid
}

.steps>div {
    border-bottom: 1px solid var(--ink);
    min-height: 200px;
    padding: 28px 28px 28px 0
}

.steps>div+div {
    border-left: 1px solid var(--line);
    padding-left: 28px
}

.steps strong {
    color: #b7b3aa;
    font-family: Georgia,serif;
    font-size: 36px;
    font-style: italic
}

.steps h2 {
    margin: 18px 0 8px;
    font-size: 22px
}

.steps p {
    color: var(--muted);
    margin: 0;
    font-size: 13px;
    line-height: 1.5
}

footer {
    border-top: 1px solid var(--line);
    min-height: 110px;
    color: var(--muted);
    justify-content: space-between;
    align-items: center;
    padding: 0 5vw;
    display: flex
}

footer span {
    letter-spacing: .2em;
    color: var(--ink);
    font-size: 13px;
    font-weight: 900
}

footer p {
    font-family: Georgia,serif;
    font-style: italic
}

@media (max-width: 760px) {
    .topbar {
        min-height:66px
    }

    .secure-note {
        display: none
    }

    .hero {
        padding-top: 58px
    }

    h1 {
        font-size: clamp(44px,14vw,70px)
    }

    .url-card {
        box-shadow: 5px 5px 0 var(--ink);
        padding: 14px
    }

    .url-row {
        grid-template-columns: auto 1fr
    }

    .url-row button {
        border: 0;
        border-top: 1px solid var(--ink);
        grid-column: 1/-1
    }

    .set-row {
        grid-template-columns: 30px 78px 1fr 36px;
        gap: 10px;
        padding: 14px 0
    }

    .set-time {
        grid-column: 2
    }

    .set-name {
        grid-area: 1/3;
        font-size: 20px
    }

    .set-area {
        grid-area: 2/3
    }

    .number {
        grid-area: 1/4/3
    }

    .export-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 20px
    }

    .reminder-fieldset,.download-button {
        width: 100%;
        min-width: 0
    }

    .custom-reminder input {
        width: 40%
    }

    .custom-reminder select {
        width: 60%
    }

    .calendar-note {
        text-align: left
    }

    .steps {
        grid-template-columns: 1fr
    }

    .steps>div {
        min-height: 0;
        padding: 22px 0
    }

    .steps>div+div {
        border-left: 0;
        padding-left: 0
    }

    footer {
        min-height: 90px
    }
}


/* Standalone version */
.url-card { display:none; }
.status-message { display:none; }
.source-line a { display:none; }
.secure-note span { color:#56a536; }
.set-row.set-unchecked { opacity:.5; }

<label class="radio-label"><input checked="" name="reminderBottom" type="radio" value="before"/>Before start</label>
</div>
<div class="custom-reminder" id="customReminderBottom">
<input aria-label="Reminder amount at the bottom" id="reminderValueBottom" max="10080" min="1" type="number" value="10"/>
<select aria-label="Reminder unit at the bottom" id="reminderUnitBottom">
<option value="minutes">minutes</option>
<option value="hours">hours</option>
</select>
</div>
</fieldset>
<div class="download-row" id="downloadRowBottom">
<button aria-expanded="false" aria-label="Calendar information" class="calendar-info-button" id="calendarInfoBottom" type="button">i</button>
<button class="download-button" id="downloadButtonBottom" type="button">Download calendar <span aria-hidden="true">↓</span></button>
</div>
</div>
<div aria-hidden="true" class="calendar-info-message" id="calendarInfoMessage" role="status"><span>Select artists to view and/or download your timetable.</span><span>After download open .ics file with your calendar app.</span></div>
</section>
</main>
<script>
(() => {
const C=document.getElementById("setsContainer"),R=[...C.querySelectorAll(".set-row")],

D=document.getElementById("downloadButton"),SS=document.getElementById("sortSelect"),
F=document.getElementById("fridayToggle"),S=document.getElementById("saturdayToggle"),
RV=document.getElementById("reminderValue"),RU=document.getElementById("reminderUnit"),
DB=document.getElementById("downloadButtonBottom"),RVB=document.getElementById("reminderValueBottom"),
RUB=document.getElementById("reminderUnitBottom"),Q=document.getElementById("artistSearch"),
SA=document.getElementById("selectAll"),CA=document.getElementById("clearAll");

const searchGroup=document.getElementById("searchGroup");
const searchBox=searchGroup.querySelector(".search-box");
const artistSuggestions=document.getElementById("artistSuggestions");
const desktopSearchSlot=document.getElementById("desktopSearchSlot");
const topExportBar=document.querySelector(".export-bar:not(.export-bar-bottom)");
const topReminderFieldset=topExportBar.querySelector(".reminder-fieldset");
const desktopInfoSlot=document.createElement("div");
desktopInfoSlot.className="desktop-info-slot";
topExportBar.insertBefore(desktopInfoSlot,topReminderFieldset);
const selectionTools=document.querySelector(".selection-tools");
const sortGroup=document.querySelector(".sort-group");
const currentDay=document.getElementById("currentDay");
const currentDayLabel=document.getElementById("currentDayLabel");
const fixedVisualTimebar=document.createElement("div");
fixedVisualTimebar.className="fixed-visual-timebar";
fixedVisualTimebar.setAttribute("aria-hidden","true");
const fixedVisualTimebarInner=document.createElement("div");
fixedVisualTimebarInner.className="fixed-visual-timebar-inner";
fixedVisualTimebar.appendChild(fixedVisualTimebarInner);
document.body.appendChild(fixedVisualTimebar);
let fixedTimebarScroller=null;
const mobileLayout=window.matchMedia("(max-width: 700px)");
const portraitSelection=window.matchMedia("(max-width: 700px) and (orientation: portrait)");
const mobileLandscape=window.matchMedia("(orientation: landscape) and (max-height: 600px), (orientation: landscape) and (pointer: coarse)");
const infoTop=document.getElementById("calendarInfoTop"),infoBottom=document.getElementById("calendarInfoBottom");
const customReminderTop=document.getElementById("customReminderTop"),customReminderBottom=document.getElementById("customReminderBottom");
const downloadRowTop=document.getElementById("downloadRowTop"),downloadRowBottom=document.getElementById("downloadRowBottom");
const infoMessage=document.getElementById("calendarInfoMessage");
const visualToggle=document.getElementById("visualToggle");
const visualTimetable=document.getElementById("visualTimetable");
const visualTimetableContent=document.getElementById("visualTimetableContent");
const visualFocusGroup=document.getElementById("visualFocusGroup");
const visualFocusSelect=document.getElementById("visualFocusSelect");
const visualFocusButton=document.getElementById("visualFocusButton");
const artistSortOption=SS.querySelector('option[value="dj"]');
const bottomExport=document.querySelector(".export-bar-bottom");
let visualMode=false,listSortValue=SS.value;
const desktopControls=()=>!mobileLayout.matches&&!mobileLandscape.matches;
function placeSearch(){
 if(desktopControls())topExportBar.insertBefore(searchGroup,desktopInfoSlot);
 else (portraitSelection.matches?selectionTools:desktopSearchSlot).appendChild(searchGroup);
}
function placeInfoButtons(){
 topExportBar.classList.toggle("desktop-toolbar",desktopControls());
 if(desktopControls()){

 }else if(portraitSelection.matches){

   customReminderBottom.appendChild(infoBottom);

 (portraitSelection.matches?currentDay:sortGroup).appendChild(visualToggle);

function placeVisualFocus(){

portraitSelection.addEventListener("change",placeTopControls);

portraitSelection.addEventListener("change",placeVisualFocus);
mobileLandscape.addEventListener("change",placeTopControls);
placeTopControls();
placeVisualToggle();
placeVisualFocus();

let infoTimer;
const defaultInfoHtml=infoMessage.innerHTML;
function placeInfoMessage(button){
 infoMessage.classList.remove("desktop-position","portrait-position","landscape-position");
 if(portraitSelection.matches){
   const buttonBox=button.getBoundingClientRect();
   document.body.appendChild(infoMessage);
   infoMessage.style.setProperty("--info-top",`${buttonBox.bottom+8}px`);
   infoMessage.classList.add("portrait-position");
 }else if(mobileLandscape.matches){
   document.body.appendChild(infoMessage);
   if(button===infoTop){
     const buttonBox=button.getBoundingClientRect();
     const searchBox=searchGroup.getBoundingClientRect();
     infoMessage.style.setProperty("--info-landscape-left",`${buttonBox.right+10}px`);
     infoMessage.style.setProperty("--info-landscape-top",`${searchBox.top+(searchBox.height/2)}px`);

   }

   document.body.appendChild(infoMessage);
 }else{

   infoMessage.classList.add("desktop-position");

function showCalendarInfo(event){
 clearTimeout(infoTimer);
 infoMessage.innerHTML=defaultInfoHtml;
 placeInfoMessage(event.currentTarget);
 infoMessage.classList.add("show");
 infoMessage.setAttribute("aria-hidden","false");
 infoTop.setAttribute("aria-expanded","true");
 infoBottom.setAttribute("aria-expanded","true");
 infoTimer=setTimeout(()=>{
   infoMessage.classList.remove("show");
   infoMessage.setAttribute("aria-hidden","true");
   infoTop.setAttribute("aria-expanded","false");
   infoBottom.setAttribute("aria-expanded","false");
 },7000);
}
function showDownloadCount(button,count){
 clearTimeout(infoTimer);
 const line=document.createElement("span");
 line.textContent=`${count} ${count===1?"artist":"artists"} included in Draaiboek.ics.`;
 infoMessage.replaceChildren(line);
 placeInfoMessage(button);
 infoMessage.classList.add("show");
 infoMessage.setAttribute("aria-hidden","false");

infoTop.onclick=showCalendarInfo;
infoBottom.onclick=showCalendarInfo;

const day=r=>((r.querySelector(".day-pill")?.textContent||"").trim().toLowerCase().startsWith("vrijdag")?"f":"s");
const time=r=>{let m=(r.querySelector(".set-time")?.textContent||"").match(/(\d{1,2}):(\d{2})/);return m? +m[1]*60 + +m[2]:0};
const area=r=>(r.querySelector(".set-area")?.textContent||"").trim().toLowerCase();
const dj=r=>(r.querySelector(".set-name")?.textContent||"").trim().toLowerCase();
const chosen=()=>R.filter(r=>r.querySelector('input[type=checkbox]').checked);
const normalizeArtist=value=>String(value||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const stateStorageKey="draaiboek-settings-v1";
let restoringState=false;
let artistHighlightTimer;
function rowStateKey(row){
 return [day(row),row.querySelector(".set-time")?.textContent.trim(),row.querySelector(".set-name")?.textContent.trim(),row.querySelector(".set-area")?.textContent.trim()].join("|");
}
function readSavedState(){
 try{return JSON.parse(localStorage.getItem(stateStorageKey)||"null")}catch{return null}
}
function persistState(){
 if(restoringState)return;
 const state={
   selected:chosen().map(rowStateKey),
   friday:F.checked,
   saturday:S.checked,
   listSort:listSortValue,
   reminderMode:document.querySelector('input[name="reminder"]:checked')?.value||"before",
   reminderValue:RV.value,
   reminderUnit:RU.value,
   visualMode,
   visualFocus:visualFocusSelect.value
 };
 try{localStorage.setItem(stateStorageKey,JSON.stringify(state))}catch{}
}
function applySavedState(){
 const state=readSavedState();
 if(!state)return false;
 if(Array.isArray(state.selected)){
   const selectedKeys=new Set(state.selected);
   R.forEach(row=>row.querySelector('input[type="checkbox"]').checked=selectedKeys.has(rowStateKey(row)));
 }
 if(typeof state.friday==="boolean")F.checked=state.friday;
 if(typeof state.saturday==="boolean")S.checked=state.saturday;
 if(["time","area","dj"].includes(state.listSort))listSortValue=state.listSort;
 SS.value=listSortValue;
 const reminderMode=state.reminderMode==="none"?"none":"before";
 document.querySelectorAll('input[name="reminder"],input[name="reminderBottom"]').forEach(radio=>radio.checked=radio.value===reminderMode);
 if(state.reminderValue!==undefined){RV.value=state.reminderValue;RVB.value=state.reminderValue}
 if(["minutes","hours"].includes(state.reminderUnit)){RU.value=state.reminderUnit;RUB.value=state.reminderUnit}
 if(["upcoming","all"].includes(state.visualFocus))visualFocusSelect.value=state.visualFocus;
 visualFocusButton.textContent=visualFocusSelect.value==="all"?"All":"Now";
 visualFocusButton.setAttribute("aria-label",visualFocusSelect.value==="all"?"Focus on all; switch to now":"Focus on now; switch to all");
 return Boolean(state.visualMode);
}

function setArtistSuggestionsVisible(visible){
 artistSuggestions.hidden=!visible;
 topExportBar.classList.toggle("suggestions-open",visible&&topExportBar.contains(searchGroup));
}

function renderArtistSuggestions(){
 const query=normalizeArtist(Q.value);
 artistSuggestions.replaceChildren();
 if(!visualMode||!query){setArtistSuggestionsVisible(false);return}
 const names=[...new Set(R.map(row=>row.querySelector(".set-name")?.textContent.trim()).filter(Boolean))]
   .filter(name=>normalizeArtist(name).includes(query))
   .sort((a,b)=>a.localeCompare(b,"en",{sensitivity:"base"}))
   .slice(0,10);
 names.forEach(name=>{
   const matchingRows=R.filter(row=>normalizeArtist(row.querySelector(".set-name")?.textContent)===normalizeArtist(name));
   const selected=matchingRows.some(row=>row.querySelector('input[type="checkbox"]').checked);
   const option=document.createElement("div");
   option.className="artist-suggestion";
   option.setAttribute("role","option");
   option.setAttribute("aria-selected",selected?"true":"false");
   const nameButton=document.createElement("button");
   nameButton.type="button";
   nameButton.className="artist-suggestion-name";
   nameButton.textContent=name;
   nameButton.addEventListener("click",()=>chooseArtistSuggestion(name));
   option.appendChild(nameButton);
   if(!selected){
     const check=document.createElement("button");
     check.type="button";
     check.className="artist-suggestion-check";
     check.setAttribute("aria-label",`Add ${name} to timetable`);
     check.addEventListener("click",()=>chooseArtistSuggestion(name));
     option.appendChild(check);
   }
   artistSuggestions.appendChild(option);
 });
 setArtistSuggestionsVisible(Boolean(names.length));
}

function chooseArtistSuggestion(name){
 Q.value=name;
 F.checked=true;
 S.checked=true;
 R.filter(row=>normalizeArtist(row.querySelector(".set-name")?.textContent)===normalizeArtist(name))
   .forEach(row=>row.querySelector('input[type="checkbox"]').checked=true);
 setArtistSuggestionsVisible(false);
 filterSort();
 Q.value="";
 if(visualMode){
   requestAnimationFrame(()=>requestAnimationFrame(()=>focusArtistInTimetable(name)));
 }
}

const matchesSelectedDay=row=>(F.checked&&day(row)==="f")||(S.checked&&day(row)==="s");
const selectButtonHtml='Select <span class="day-action-icon" aria-hidden="true">✓</span>';
const deleteButtonHtml='Delete <span class="day-action-icon" aria-hidden="true">✓</span>';
function deleteForSelectedDays(){
 R.filter(matchesSelectedDay).forEach(row=>row.querySelector('input[type="checkbox"]').checked=false);
 update();
}

function update(){
 let n=chosen().length;
 let deletableCount=chosen().filter(matchesSelectedDay).length;
 if(!n&&visualMode)setVisualMode(false);
 visualToggle.disabled=n===0;
 visualToggle.setAttribute("aria-disabled",n===0?"true":"false");
 D.innerHTML=`Download calendar <span aria-hidden="true">↓</span>`;
 D.disabled = n === 0;
 D.setAttribute("aria-disabled", n === 0 ? "true" : "false");
 DB.innerHTML=`Download calendar <span aria-hidden="true">↓</span>`;
 DB.disabled = n === 0;
 DB.setAttribute("aria-disabled", n === 0 ? "true" : "false");
 if(portraitSelection.matches&&deletableCount>0){
   SA.innerHTML=deleteButtonHtml;
   SA.setAttribute("aria-label","Delete selected artists from the selected days");
 }else{
   SA.innerHTML=selectButtonHtml;
   SA.setAttribute("aria-label","Select artists from the selected days");
 }
 SA.disabled=!F.checked&&!S.checked;
 CA.innerHTML=deleteButtonHtml;
 CA.setAttribute("aria-label","Delete selected artists from the selected days");
 CA.disabled=deletableCount===0;
 R.forEach(r=>{let c=r.querySelector('input[type=checkbox]'),m=r.querySelector(".custom-check");
 r.classList.toggle("set-unchecked",!c.checked); if(m)m.textContent=c.checked?"✓":""});
 if(visualMode)renderVisualTimetable();
 persistState();
}
function filterSort(){
 const fridaySelected=F.checked;
 const saturdaySelected=S.checked;
 const noDaySelected=!fridaySelected&&!saturdaySelected;
 let query=String(Q.value||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
 let visible=R.filter(r=>{
   let matchesDay=noDaySelected||(day(r)==="f"&&fridaySelected)||(day(r)==="s"&&saturdaySelected);
   let artist=dj(r).normalize("NFKD").replace(/[\u0300-\u036f]/g,"");
   return matchesDay&&(!query||artist.includes(query));
 });
 let sort=SS.value;
 visible.sort((a,b)=>{
   if(sort==="area") return area(a).localeCompare(area(b),"nl");
   if(sort==="dj") return dj(a).localeCompare(dj(b),"nl");
   return day(a)!==day(b)?(day(a)==="f"?-1:1):time(a)-time(b);
 });
 [...visible,...R.filter(r=>!visible.includes(r))].forEach(r=>{
   C.appendChild(r);
   r.style.display=visible.includes(r)?"":"none";
 });
 F.checked=fridaySelected;
 S.checked=saturdaySelected;
 update();
}
R.forEach(r=>{
 let c=r.querySelector('input[type=checkbox]'); c.checked=true;
 c.addEventListener("change",update);
});
SA.onclick=()=>{
 if(portraitSelection.matches&&chosen().some(matchesSelectedDay)){
   deleteForSelectedDays();
 }else{
   R.filter(matchesSelectedDay).forEach(r=>r.querySelector('input[type=checkbox]').checked=true);
   update();
 }
};
CA.onclick=deleteForSelectedDays;
portraitSelection.addEventListener("change",()=>{placeInfoButtons();update()});
SS.addEventListener("change",()=>{
 if(!visualMode)listSortValue=SS.value;
 if(SS.value==="dj"&&F.checked&&S.checked){
   F.checked=false;
   S.checked=false;
 }
 filterSort();
 requestAnimationFrame(()=>SS.blur());
});
[F,S].forEach(x=>x.addEventListener("change",filterSort));
Q.addEventListener("input",()=>{
 if(Q.value.trim()){
   F.checked=true;
   S.checked=true;
   if(portraitSelection.matches){
     requestAnimationFrame(()=>{
       const fieldTop=searchGroup.getBoundingClientRect().top;
       if(fieldTop>12)window.scrollBy({top:fieldTop-8,behavior:"smooth"});
     });
   }
 }
 renderArtistSuggestions();
 filterSort();
 requestAnimationFrame(updateCurrentDay);
});
Q.addEventListener("focus",renderArtistSuggestions);
Q.addEventListener("keydown",event=>{
 if(event.key==="Escape")setArtistSuggestionsVisible(false);
});
document.addEventListener("pointerdown",event=>{
 if(!searchBox.contains(event.target))setArtistSuggestionsVisible(false);
});
document.getElementById("clearSearch").onclick=()=>{
 Q.value="";
 setArtistSuggestionsVisible(false);
 filterSort();
 requestAnimationFrame(updateCurrentDay);
 Q.focus();
};

const topReminder=[...document.querySelectorAll('input[name="reminder"]')];
const bottomReminder=[...document.querySelectorAll('input[name="reminderBottom"]')];
function syncReminder(from,to){
 const selected=from.find(r=>r.checked)?.value;
 to.forEach(r=>r.checked=r.value===selected);
}
topReminder.forEach(r=>r.addEventListener("change",()=>{syncReminder(topReminder,bottomReminder);persistState()}));
bottomReminder.forEach(r=>r.addEventListener("change",()=>{syncReminder(bottomReminder,topReminder);persistState()}));
RV.addEventListener("input",()=>{RVB.value=RV.value;persistState()});
RVB.addEventListener("input",()=>{RV.value=RVB.value;persistState()});
RU.addEventListener("change",()=>{RUB.value=RU.value;persistState()});
RUB.addEventListener("change",()=>{RU.value=RUB.value;persistState()});

function esc(s){return String(s).replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\r?\n/g,"\\n")}
function fold(x){let o="",c="",b=new TextEncoder();for(let ch of x){if(b.encode(c+ch).length>75){o+=c+"\r\n ";c=ch}else c+=ch}return o+c}
function stamp(d,h,m){return d.replaceAll("-","")+"T"+String(h).padStart(2,"0")+String(m).padStart(2,"0")+"00"}
function start(day,t){let d=day==="f"?"2026-09-04":"2026-09-05",[h,m]=t.split(":").map(Number);return{d,h,m}}
function end(d,h,m){let x=new Date(`${d}T${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:00`);if(h<6)x.setDate(x.getDate()+1);return{d:x.toISOString().slice(0,10),h:x.getHours(),m:x.getMinutes()}}
function mins(){if(document.querySelector('input[name=reminder]:checked')?.value==="none")return null;let v=Math.max(1,+RV.value||10);return RU.value==="hours"?v*60:v}

function downloadCalendar(messageButton){
 let ch=chosen();
 if(!ch.length)return;

 const pad=n=>String(n).padStart(2,"0");
 const now=new Date();
 const dtstamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+
   "T"+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+"Z";
 const rm=mins();

 const uidPart=s=>{
   return String(s).normalize("NFKD")
     .replace(/[\u0300-\u036f]/g,"")
     .toLowerCase()
     .replace(/[^a-z0-9]+/g,"-")
     .replace(/^-+|-+$/g,"")
     .slice(0,80);
 };

 // Use the same ICS structure that is known to import correctly on Android.
 // Event times are explicitly Europe/Amsterdam local times.
 const L=[
   "BEGIN:VCALENDAR",
   "VERSION:2.0",
   "PRODID:-//Draaiboek//Draaimolen Festival 2026//NL",
   "CALSCALE:GREGORIAN"
 ];

 ch.forEach((r,i)=>{
   const da=day(r);
   const times=r.querySelector(".set-time").textContent.trim().split("–").map(x=>x.trim());
   const startTime=times[0];
   const endTime=times[1]||times[0];
   const name=r.querySelector(".set-name").textContent.trim();
   const ar=r.querySelector(".set-area").textContent.trim();

   const date=da==="f"?"20260904":"20260905";
   const [sh,sm]=startTime.split(":").map(Number);
   const [eh,em]=endTime.split(":").map(Number);

   let endDate=date;
   if((eh*60+em)<(sh*60+sm)){
     const d=new Date(Date.UTC(Number(date.slice(0,4)),Number(date.slice(4,6))-1,Number(date.slice(6,8))+1));
     endDate=d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate());
   }

   L.push("BEGIN:VEVENT");
   L.push(`UID:draaimolen-${date}-${pad(sh)}${pad(sm)}-${pad(eh)}${pad(em)}-${uidPart(name)}-${uidPart(ar)}@draaiboek.local`);
   L.push(`DTSTAMP:${dtstamp}`);
   L.push(`DTSTART;TZID=Europe/Amsterdam:${date}T${pad(sh)}${pad(sm)}00`);
   L.push(`DTEND;TZID=Europe/Amsterdam:${endDate}T${pad(eh)}${pad(em)}00`);
   L.push(`SUMMARY:${esc(name+" - "+ar)}`);
   L.push(`DESCRIPTION:${esc(name+" - "+ar)}`);
   L.push(`LOCATION:${esc(ar)}`);

   if(rm!==null){
     L.push("BEGIN:VALARM");
     L.push(`TRIGGER:-PT${rm}M`);
     L.push("ACTION:DISPLAY");
     L.push(`DESCRIPTION:${esc(name)} starts in ${rm} minutes`);
     L.push("END:VALARM");
   }

   L.push("END:VEVENT");
 });

 L.push("END:VCALENDAR");

 // No METHOD:PUBLISH, no VTIMEZONE and no BOM: this matches the
 // simple ICS structure known to import correctly on Android.
 const ics=L.join("\r\n")+"\r\n";
 const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="Draaiboek.ics";
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 showDownloadCount(messageButton,ch.length);
}
D.onclick=()=>downloadCalendar(infoTop);
DB.onclick=()=>downloadCalendar(infoBottom);

function visualMinute(value){
 const parts=String(value).trim().split(":").map(Number);
 let total=(parts[0]||0)*60+(parts[1]||0);
 if(total<360)total+=1440;
 return total-720;
}
function visualSetData(row){
 const values=row.querySelector(".set-time").textContent.trim().split("–").map(x=>x.trim());
 const start=visualMinute(values[0]);
 let end=visualMinute(values[1]||values[0]);
 if(end<=start)end+=1440;
 return{
   row,
   start,
   end,
   timeText:`${values[0]} – ${values[1]||values[0]}`,
   name:row.querySelector(".set-name").textContent.trim(),
   area:row.querySelector(".set-area").textContent.trim(),
   overlap:false,
   lane:0
 };
}
const visualAreaOrder=["STROBE","MOON","AURA","FOREST RAVE","THE PIT","TUNNEL"];
const visualAreaLabels={
 "STROBE":"Strobe","MOON":"Moon","AURA":"Aura",
 "FOREST RAVE":"Forest Rave","THE PIT":"The Pit","TUNNEL":"Tunnel"
};
const visualAreaColors={
 "AURA":{background:"#9B6DFF",text:"#fff"},
 "FOREST RAVE":{background:"#3B8C5A",text:"#fff"},
 "STROBE":{background:"#D8FF3E",text:"#171714"},
 "THE PIT":{background:"#B83A3A",text:"#fff"},
 "TUNNEL":{background:"#3F4856",text:"#fff"},
 "MOON":{background:"#9EDCFF",text:"#171714"}
};
R.forEach(row=>{
 const areaElement=row.querySelector(".set-area");
 const stage=visualAreaColors[(areaElement?.textContent||"").trim().toUpperCase()];
 if(!areaElement||!stage)return;
 areaElement.style.backgroundColor=stage.background;
 areaElement.style.setProperty("color",stage.text,"important");
});
function currentClockVisualMinute(){
 const now=new Date();
 let hour=now.getHours();
 if(hour<6)hour+=24;
 return Math.max(0,Math.min(750,(hour*60+now.getMinutes())-720));
}
let expandedVisualBlock=null;
let expandedVisualTimer;
function collapseExpandedVisualBlock(){
 clearTimeout(expandedVisualTimer);
 if(!expandedVisualBlock)return;
 const scroller=expandedVisualBlock.closest(".visual-scroll");
 expandedVisualBlock.classList.remove("is-expanded");
 expandedVisualBlock.style.left=expandedVisualBlock.dataset.originalLeft||"";
 expandedVisualBlock.style.width=expandedVisualBlock.dataset.originalWidth||"";
 expandedVisualBlock.style.setProperty("--label-shift",expandedVisualBlock.dataset.originalLabelShift||"0px");
 delete expandedVisualBlock.dataset.originalLeft;
 delete expandedVisualBlock.dataset.originalWidth;
 delete expandedVisualBlock.dataset.originalLabelShift;
 expandedVisualBlock=null;
 if(scroller)requestAnimationFrame(()=>updateVisualBlockLabels(scroller));
}
function expandVisualBlock(block,nameElement){
 if(nameElement.scrollWidth<=nameElement.clientWidth+1)return;
 collapseExpandedVisualBlock();
 const timeline=block.parentElement;
 const scroller=block.closest(".visual-scroll");
 const chartWidth=timeline.clientWidth;
 const desiredWidth=Math.min(380,Math.max(240,nameElement.scrollWidth+28));
 const expandedWidth=Math.min(desiredWidth,chartWidth-16);
 const viewportStart=scroller?Math.max(0,scroller.scrollLeft-timeline.offsetLeft):0;
 const expandedLeft=Math.max(8,Math.min(Math.max(block.offsetLeft,viewportStart+8),chartWidth-expandedWidth-8));
 block.dataset.originalLeft=block.style.left;
 block.dataset.originalWidth=block.style.width;
 block.dataset.originalLabelShift=block.style.getPropertyValue("--label-shift")||"0px";
 block.style.left=`${expandedLeft}px`;
 block.style.width=`${expandedWidth}px`;
 block.style.setProperty("--label-shift","0px");
 block.classList.add("is-expanded");
 expandedVisualBlock=block;
 expandedVisualTimer=setTimeout(collapseExpandedVisualBlock,2000);
}
function updateVisualBlockLabels(scroller){
 const timeline=scroller.querySelector(".visual-timeline");
 if(!timeline)return;
 const chart=scroller.querySelector(".visual-chart");
 chart?.querySelectorAll(".visual-area-label").forEach(label=>{
   label.style.transform=desktopControls()?`translateX(${scroller.scrollLeft}px)`:"";
 });
 timeline.querySelectorAll(".visual-set-block").forEach(block=>{
   if(block.classList.contains("is-expanded")){
     block.style.setProperty("--label-shift","0px");
     return;
   }
   const blockStart=timeline.offsetLeft+block.offsetLeft;
   const desiredShift=Math.max(0,scroller.scrollLeft-blockStart+8);
   const maximumShift=Math.max(0,block.offsetWidth-96);
   block.style.setProperty("--label-shift",`${Math.min(desiredShift,maximumShift)}px`);
 });
 if(visualMode)updateStickyVisualTimeHeaders();
}
function focusArtistInTimetable(name,allowAllFallback=true){
 const normalizedName=normalizeArtist(name);
 const block=[...visualTimetableContent.querySelectorAll(".visual-set-block")]
   .find(candidate=>normalizeArtist(candidate.dataset.artist)===normalizedName);
 if(!block&&allowAllFallback&&visualFocusSelect.value==="upcoming"){
   visualFocusSelect.value="all";
   visualFocusButton.textContent="All";
   visualFocusButton.setAttribute("aria-label","Focus on all; switch to now");
   renderVisualTimetable();
   requestAnimationFrame(()=>requestAnimationFrame(()=>focusArtistInTimetable(name,false)));
   return;
 }
 if(!block)return;
 block.classList.add("search-match");
 const scroller=block.closest(".visual-scroll");
 const timeline=block.closest(".visual-timeline");
 if(scroller&&timeline){
   const targetLeft=timeline.offsetLeft+block.offsetLeft-((scroller.clientWidth-block.offsetWidth)/2);
   scroller.scrollTo({left:Math.max(0,targetLeft),behavior:"smooth"});
 }
 const blockBox=block.getBoundingClientRect();
 const controlsBottom=Math.max(0,selectionTools.getBoundingClientRect().bottom);
 const targetTop=window.scrollY+blockBox.top-controlsBottom-44;
 window.scrollTo({top:Math.max(0,targetTop),behavior:"smooth"});
 clearTimeout(artistHighlightTimer);
 artistHighlightTimer=setTimeout(()=>{
   visualTimetableContent.querySelectorAll(".search-match").forEach(match=>{
     if(normalizeArtist(match.dataset.artist)===normalizedName)match.classList.remove("search-match");
   });
 },2700);
}
function renderVisualDay(dayCode,label,rows){
 const daySection=document.createElement("section");
 daySection.className="visual-day";
 daySection.dataset.day=dayCode;
 const heading=document.createElement("h2");
 heading.className="visual-day-title";
 heading.textContent=label;
 daySection.appendChild(heading);

 const scroller=document.createElement("div");
 scroller.className="visual-scroll";
 const chart=document.createElement("div");
 chart.className="visual-chart";
 const timeline=document.createElement("div");
 timeline.className="visual-timeline";
 chart.appendChild(timeline);
 const timelineStart=visualFocusSelect.value==="upcoming"?currentClockVisualMinute():0;
 const timelineEnd=750;
 const range=Math.max(1,timelineEnd-timelineStart);
 timeline.dataset.start=String(timelineStart);
 timeline.dataset.end=String(timelineEnd);
  const items=rows.map(visualSetData).sort((a,b)=>a.start-b.start||a.end-b.end);
  const areaMode=SS.value==="area";
  chart.classList.toggle("area-mode",areaMode);
  const visibleDurations=items
    .filter(item=>item.end>timelineStart)
    .map(item=>Math.max(5,item.end-Math.max(item.start,timelineStart)));
  const shortestVisibleDuration=Math.min(...visibleDurations,range);
  const minimumBlockWidth=132;
  const areaLabelWidth=areaMode&&!portraitSelection.matches?122:0;
  const requiredChartWidth=Math.ceil((range/shortestVisibleDuration)*minimumBlockWidth)+areaLabelWidth;
  const visibleItems=items.filter(item=>item.end>timelineStart);
  const latestVisibleStart=visibleItems.length?Math.max(...visibleItems.map(item=>item.start)):Infinity;
  const compactFinalWindow=portraitSelection.matches&&visualFocusSelect.value==="upcoming"&&timelineStart>=latestVisibleStart;
  chart.classList.toggle("compact-final-window",compactFinalWindow);
  chart.style.minWidth=compactFinalWindow?"100%":`${Math.max(900,Math.min(6000,requiredChartWidth))}px`;

 for(let i=0;i<items.length;i++){
   for(let j=i+1;j<items.length;j++){
     if(items[j].start>=items[i].end)break;
     if(items[i].start<items[j].end&&items[j].start<items[i].end){
       items[i].overlap=true;
       items[j].overlap=true;
     }
   }
 }

 const laneEnds=[];
 let activeAreas=[];
 if(areaMode){
   activeAreas=visualAreaOrder.filter(areaName=>items.some(item=>item.area.toUpperCase()===areaName));
   items.forEach(item=>{
     const areaIndex=activeAreas.indexOf(item.area.toUpperCase());
     item.lane=areaIndex<0?activeAreas.length:areaIndex;
   });
   activeAreas.forEach((areaName,lane)=>{
     const stage=visualAreaColors[areaName];
     const areaLabel=document.createElement("div");
     areaLabel.className="visual-area-label";
     areaLabel.style.top=`${44+(lane*72)}px`;
     areaLabel.style.backgroundColor=stage.background;
     areaLabel.style.color=stage.text;
     areaLabel.textContent=visualAreaLabels[areaName];
     chart.appendChild(areaLabel);
   });
 }else{
   items.forEach(item=>{
     let lane=laneEnds.findIndex(end=>end<=item.start);
     if(lane<0)lane=laneEnds.length;
     item.lane=lane;
     laneEnds[lane]=item.end;
   });
 }

 const formatVisualMinute=minute=>{
   const total=(720+minute)%1440;
   return `${String(Math.floor(total/60)).padStart(2,"0")}:${String(total%60).padStart(2,"0")}`;
  };
  const tickMinutes=[];
  tickMinutes.push(timelineStart);
  const tickStep=60;
  for(let minute=Math.ceil(timelineStart/tickStep)*tickStep;minute<timelineEnd;minute+=tickStep){
    const farEnoughFromNow=visualFocusSelect.value!=="upcoming"||minute-timelineStart>=45;
    if(minute>timelineStart&&farEnoughFromNow)tickMinutes.push(minute);
 }
 if(tickMinutes[tickMinutes.length-1]!==timelineEnd)tickMinutes.push(timelineEnd);
 const ticks=tickMinutes.filter(minute=>minute!==720).map(minute=>[minute,formatVisualMinute(minute)]);
  ticks.forEach(([minute,labelText])=>{
   const tick=document.createElement("div");
   tick.className="visual-tick";
   tick.style.left=`${((minute-timelineStart)/range)*100}%`;
   const tickLabel=document.createElement("span");
   tickLabel.className="visual-tick-label";
   tickLabel.textContent=labelText;
   if(minute===720){
     tickLabel.style.transform="translateX(-100%)";
    }
    if(minute===timelineEnd){
      tickLabel.style.transform="translateX(-100%)";
   }
   tick.appendChild(tickLabel);
    timeline.appendChild(tick);
  });

  if(visualFocusSelect.value==="all"){
    const nowMinute=currentClockVisualMinute();
    if(nowMinute>=timelineStart&&nowMinute<=timelineEnd){
      const nowLine=document.createElement("div");
      nowLine.className="visual-now-line";
      nowLine.style.left=`${((nowMinute-timelineStart)/range)*100}%`;
      const nowLabel=document.createElement("span");
      nowLabel.className="visual-now-label";
      nowLabel.textContent="Now";
      nowLine.appendChild(nowLabel);
      timeline.appendChild(nowLine);
    }
  }

  items.forEach(item=>{
   if(item.end<=timelineStart)return;
   const visibleStart=Math.max(item.start,timelineStart);
   const block=document.createElement("div");
   block.className=`visual-set-block${item.overlap?" has-overlap":""}`;
   block.dataset.artist=item.name;
   const searchQuery=String(Q.value||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
   const searchableName=item.name.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
   block.classList.toggle("search-match",Boolean(searchQuery&&searchableName.includes(searchQuery)));
   const stage=visualAreaColors[item.area.toUpperCase()]||{background:"#D8FF3E",text:"#171714"};
   block.style.backgroundColor=stage.background;
   block.style.color=stage.text;
   block.style.left=`${Math.max(0,(visibleStart-timelineStart)/range*100)}%`;
   block.style.width=`${Math.max(.8,(item.end-visibleStart)/range*100)}%`;
   block.style.top=`${44+(item.lane*72)}px`;
   block.title=`${item.name} — ${item.timeText} — ${item.area}`;
   block.setAttribute("aria-label",block.title);
   block.setAttribute("role","group");
   block.tabIndex=0;
   block.addEventListener("click",()=>expandVisualBlock(block,name));
   block.addEventListener("keydown",event=>{
     if(event.target!==block)return;
     if(event.key==="Enter"||event.key===" "){
       event.preventDefault();
       expandVisualBlock(block,name);
     }
   });
   const name=document.createElement("div");
   name.className="visual-set-name";
   name.textContent=item.name;
    const removeButton=document.createElement("button");
    removeButton.className="visual-remove-set";
    removeButton.type="button";
    removeButton.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>';
   removeButton.setAttribute("aria-label",`Remove ${item.name} from my timetable`);
   removeButton.addEventListener("click",event=>{
     event.preventDefault();
     event.stopPropagation();
     item.row.querySelector('input[type="checkbox"]').checked=false;
     update();
   });
    const meta=document.createElement("div");
    meta.className="visual-set-meta";
     const timeLine=document.createElement("div");
     timeLine.className="visual-set-time";
     timeLine.textContent=item.timeText;
   const areaLine=document.createElement("div");
   areaLine.className="visual-set-area";
   areaLine.textContent=item.area;
   meta.append(timeLine,areaLine);
   block.append(removeButton,name,meta);
   timeline.appendChild(block);
 });

 const laneCount=areaMode?Math.max(1,activeAreas.length):Math.max(1,laneEnds.length);
  chart.style.height=`${Math.max(116,52+(laneCount*72))}px`;
  scroller.appendChild(chart);
  scroller.addEventListener("scroll",()=>updateVisualBlockLabels(scroller),{passive:true});
  requestAnimationFrame(()=>updateVisualBlockLabels(scroller));
  daySection.appendChild(scroller);
 return daySection;
}
function renderVisualTimetable(){
 const scrollPositions=new Map();
 visualTimetableContent.querySelectorAll(".visual-day").forEach(daySection=>{
   const scroller=daySection.querySelector(".visual-scroll");
   if(scroller)scrollPositions.set(daySection.dataset.day,scroller.scrollLeft);
 });
 collapseExpandedVisualBlock();
 visualTimetableContent.replaceChildren();
 let selected=chosen();
 if(visualFocusSelect.value==="upcoming"){
   const currentMinute=currentClockVisualMinute();
   selected=selected.filter(row=>visualSetData(row).end>currentMinute);
 }
 const useBoth=!F.checked&&!S.checked;
 const fridayRows=selected.filter(r=>day(r)==="f"&&(useBoth||F.checked));
 const saturdayRows=selected.filter(r=>day(r)==="s"&&(useBoth||S.checked));
 if(!fridayRows.length&&!saturdayRows.length){
   const empty=document.createElement("div");
   empty.className="visual-empty";
   empty.textContent=chosen().length?"No selected artists are currently playing or still to come.":"Select artists to view and/or download your timetable.";
   visualTimetableContent.appendChild(empty);
   return;
 }
 if(fridayRows.length)visualTimetableContent.appendChild(renderVisualDay("f","Friday",fridayRows));
 if(saturdayRows.length)visualTimetableContent.appendChild(renderVisualDay("s","Saturday",saturdayRows));
  requestAnimationFrame(()=>{
   visualTimetableContent.querySelectorAll(".visual-day").forEach(daySection=>{
     const scroller=daySection.querySelector(".visual-scroll");
      const savedPosition=scrollPositions.get(daySection.dataset.day);
      if(scroller&&savedPosition!==undefined){
        scroller.scrollLeft=savedPosition;
        updateVisualBlockLabels(scroller);
      }
    });
    updateStickyVisualTimeHeaders();
    updateCurrentDay();
  });
}
function scrollVisualTimetablesToNow(){
 if(visualFocusSelect.value!=="all")return;
 visualTimetableContent.querySelectorAll(".visual-scroll").forEach(scroller=>{
   const timeline=scroller.querySelector(".visual-timeline");
   const nowLine=scroller.querySelector(".visual-now-line");
   if(!timeline||!nowLine)return;
   const target=timeline.offsetLeft+nowLine.offsetLeft-(scroller.clientWidth/2);
   scroller.scrollTo({left:Math.max(0,target),behavior:"smooth"});
  });
}
let visualHeaderFrame;
function updateStickyVisualTimeHeaders(){
 cancelAnimationFrame(visualHeaderFrame);
 visualHeaderFrame=requestAnimationFrame(()=>{
   const charts=[...visualTimetableContent.querySelectorAll(".visual-chart")];
   charts.forEach(chart=>{
     chart.classList.remove("sticky-time-head","floating-time-source");
     chart.style.setProperty("--sticky-time-offset","0px");
   });
   const stickyTop=Math.max(0,selectionTools.getBoundingClientRect().bottom-1);
   const activeChart=visualMode?charts.find(chart=>{
     const bounds=chart.getBoundingClientRect();
     return bounds.top<stickyTop&&bounds.bottom>stickyTop+41;
   }):null;
   if(!activeChart){
     fixedTimebarScroller=null;
     fixedVisualTimebar.classList.remove("show","dragging");
     fixedVisualTimebar.setAttribute("aria-hidden","true");
     return;
   }
   const scroller=activeChart.closest(".visual-scroll");
   const timeline=activeChart.querySelector(".visual-timeline");
   if(!scroller||!timeline)return;
   fixedTimebarScroller=scroller;
   activeChart.classList.add("floating-time-source");
   const scrollerBox=scroller.getBoundingClientRect();
   fixedVisualTimebar.style.top=`${stickyTop}px`;
   fixedVisualTimebar.style.left=`${scrollerBox.left}px`;
   fixedVisualTimebar.style.width=`${scrollerBox.width}px`;
   fixedVisualTimebarInner.style.width=`${activeChart.offsetWidth}px`;
   fixedVisualTimebarInner.style.transform=`translateX(${-scroller.scrollLeft}px)`;
   fixedVisualTimebarInner.replaceChildren();
   timeline.querySelectorAll(".visual-tick").forEach(tick=>{
     const source=tick.querySelector(".visual-tick-label");
     if(!source)return;
     const label=document.createElement("span");
     label.className="fixed-visual-time-label";
     label.textContent=source.textContent;
     label.style.left=`${timeline.offsetLeft+tick.offsetLeft+5}px`;
     label.style.transform=source.style.transform||"";
     fixedVisualTimebarInner.appendChild(label);
   });
   const sourceNow=timeline.querySelector(".visual-now-line");
   if(sourceNow){
     const nowLine=document.createElement("div");
     nowLine.className="fixed-visual-now-line";
     nowLine.style.left=`${timeline.offsetLeft+sourceNow.offsetLeft}px`;
     const nowLabel=document.createElement("span");
     nowLabel.className="fixed-visual-now-label";
     nowLabel.textContent="Now";
     nowLine.appendChild(nowLabel);
     fixedVisualTimebarInner.appendChild(nowLine);
   }
   fixedVisualTimebar.classList.add("show");
   fixedVisualTimebar.setAttribute("aria-hidden","false");
 });
}
let fixedTimebarDrag=null;
fixedVisualTimebar.addEventListener("pointerdown",event=>{
 if(!fixedTimebarScroller||event.button!==0)return;
 fixedTimebarDrag={x:event.clientX,scrollLeft:fixedTimebarScroller.scrollLeft};
 fixedVisualTimebar.classList.add("dragging");
 fixedVisualTimebar.setPointerCapture(event.pointerId);
});
fixedVisualTimebar.addEventListener("pointermove",event=>{
 if(!fixedTimebarDrag||!fixedTimebarScroller)return;
 fixedTimebarScroller.scrollLeft=fixedTimebarDrag.scrollLeft-(event.clientX-fixedTimebarDrag.x);
});
function stopFixedTimebarDrag(){
 fixedTimebarDrag=null;
 fixedVisualTimebar.classList.remove("dragging");
}
fixedVisualTimebar.addEventListener("pointerup",stopFixedTimebarDrag);
fixedVisualTimebar.addEventListener("pointercancel",stopFixedTimebarDrag);
function setVisualMode(enabled){
 if(enabled){
   listSortValue=SS.value;
   SS.value="area";
 }else{
   SS.value=listSortValue;
 }
 visualMode=enabled;
 SS.hidden=enabled;
 artistSortOption.hidden=enabled;
 artistSortOption.disabled=enabled;
 artistSortOption.style.display=enabled?"none":"";
 visualFocusGroup.hidden=!enabled;
 bottomExport.hidden=enabled;
 selectionTools.classList.toggle("visual-mode",enabled);
 placeVisualFocus();
 C.hidden=enabled;
 currentDay.hidden=enabled&&!portraitSelection.matches;
 visualTimetable.hidden=!enabled;
 visualToggle.textContent=enabled?"List":"Timetable";
 visualToggle.setAttribute("aria-pressed",enabled?"true":"false");
 if(enabled){
   renderVisualTimetable();
   if(document.activeElement===Q)renderArtistSuggestions();
 }
 else{
   setArtistSuggestionsVisible(false);
   filterSort();
   requestAnimationFrame(updateCurrentDay);
  }
 requestAnimationFrame(updateStickyVisualTimeHeaders);
 persistState();
}
window.addEventListener("scroll",updateStickyVisualTimeHeaders,{passive:true});
window.addEventListener("resize",updateStickyVisualTimeHeaders,{passive:true});
visualToggle.addEventListener("click",()=>setVisualMode(!visualMode));
visualFocusButton.addEventListener("click",()=>{
 visualFocusSelect.value=visualFocusSelect.value==="upcoming"?"all":"upcoming";
 visualFocusButton.textContent=visualFocusSelect.value==="all"?"All":"Now";
 visualFocusButton.setAttribute("aria-label",visualFocusSelect.value==="all"?"Focus on all; switch to now":"Focus on now; switch to all");
 renderVisualTimetable();
 requestAnimationFrame(scrollVisualTimetablesToNow);
 persistState();
});
setInterval(()=>{
 if(visualMode&&!expandedVisualBlock)renderVisualTimetable();
},60000);
function updateCurrentDay(){
 if(visualMode&&portraitSelection.matches){
   const sections=[...visualTimetableContent.querySelectorAll(".visual-day")];
   if(!sections.length){currentDayLabel.textContent="";return}
   const marker=currentDay.getBoundingClientRect().bottom;
   let best=sections[0];
   sections.forEach(section=>{
     if(section.getBoundingClientRect().top<=marker+1)best=section;
   });
   currentDayLabel.textContent=best.dataset.day==="f"?"FRIDAY":"SATURDAY";
   return;
 }
 const visible=R.filter(r=>r.style.display!=="none");
 if(!visible.length){currentDayLabel.textContent="";return}
 const top=currentDay.getBoundingClientRect().bottom;
 let best=visible[0],bestDistance=Infinity;
 visible.forEach(r=>{
   const rect=r.getBoundingClientRect();
   const distance=Math.abs(rect.top-top);
   if(rect.bottom>=top-10&&distance<bestDistance){best=r;bestDistance=distance}
 });
 currentDayLabel.textContent=day(best)==="f"?"FRIDAY":"SATURDAY";
}
window.addEventListener("scroll",updateCurrentDay,{passive:true});
[SS,F,S].forEach(x=>x.addEventListener("change",()=>requestAnimationFrame(updateCurrentDay)));
restoringState=true;
const restoreVisualMode=applySavedState();
filterSort();
updateCurrentDay();
if(restoreVisualMode&&chosen().length)setVisualMode(true);
restoringState=false;
persistState();
})();
</script></body>
